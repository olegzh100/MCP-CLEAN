<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP-CLEAN Control Center</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MCP-CLEAN</div>
        <h1>MCP-CLEAN Control Center</h1>
      </div>
      <div class="status-strip" id="statusStrip"></div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <section class="hero">
      <div class="hero-card">
        <h2>Browser Auto Mode</h2>
        <p>Панель сама отслеживает открытые вкладки Edge, определяет контекст и запускает нужные безопасные read-only модули. Ручной выбор нужен только при необходимости.</p>
        <div class="hero-actions">
          <button id="refreshBtn">Проверить сейчас</button>
          <button class="ghost" id="openMixedBtn">Авто</button>
        </div>
      </div>
      <div class="hero-card accent">
        <h2>Current Context</h2>
        <p id="currentTask">Загрузка...</p>
      </div>
    </section>
    <section id="content"></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
