name: Multi-Market Job Bridge Results

on:
  push:
    branches: [main]
    paths:
      - "job-bridge/requests/*.json"

permissions:
  contents: write

concurrency:
  group: multi-market-job-bridge-results-v2
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect terminal Job API results for requests from this push
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p job-bridge/results

          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'job-bridge/requests/*.json' || true)
          requests=()
          for path in "${changed[@]}"; do
            if [ -f "$path" ]; then
              requests+=("$path")
            fi
          done

          if [ ${#requests[@]} -eq 0 ]; then
            echo "No new request files in this push"
            exit 0
          fi

          for req in "${requests[@]}"; do
            request_id="$(jq -r '.request_id' "$req")"
            expected_file="job-bridge/results/${request_id}.json"

            if [ -f "$expected_file" ]; then
              echo "Receipt already present for $request_id; removing request"
              rm -f "$req"
              continue
            fi

            if ! [[ "$request_id" =~ ^[a-f0-9-]{36}$ ]]; then
              echo "Invalid request id: $request_id" >&2
              exit 1
            fi

            url="https://178.212.13.248/job-bridge/results/${request_id}.json"
            tmp="$(mktemp)"
            terminal=""

            for attempt in $(seq 1 360); do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url" -o "$tmp"; then
                status="$(jq -r '.status // empty' "$tmp")"
                case "$status" in
                  SUCCEEDED|FAILED|REJECTED|BRIDGE_TIMEOUT)
                    report_verified_json="null"
                    job_id="$(jq -r '.job_id // empty' "$tmp")"
                    domain="$(jq -r '.domain // empty' "$tmp")"
                    kind="$(jq -r '.kind // empty' "$tmp")"

                    if [ "$status" = "SUCCEEDED" ] && [ "$domain" = "trading" ] && [ "$kind" = "backtest" ]; then
                      if [ -z "$job_id" ]; then
                        echo "SUCCEEDED backtest result has no job_id for $request_id" >&2
                        exit 1
                      fi

                      report_url="https://178.212.13.248/trading-api/paper/backtests/${job_id}"
                      report_tmp="$(mktemp)"
                      report_ok=""
                      for report_attempt in $(seq 1 20); do
                        if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$report_url" -o "$report_tmp"; then
                          returned_job_id="$(jq -r '.job_id // empty' "$report_tmp" 2>/dev/null || true)"
                          if [ "$returned_job_id" = "$job_id" ] && jq -e '.report | type == "object"' "$report_tmp" >/dev/null 2>&1; then
                            report_ok="yes"
                            report_verified_json="true"
                            echo "Verified published report for job_id=$job_id"
                            break
                          fi
                        fi
                        sleep 3
                      done
                      rm -f "$report_tmp"

                      if [ -z "$report_ok" ]; then
                        echo "Terminal backtest succeeded but published report is not readable for job_id=$job_id" >&2
                        exit 1
                      fi
                    fi

                    jq --argjson report_verified "$report_verified_json" '{
                      schema_version: (.schema_version // 1),
                      request_id,
                      job_id,
                      status,
                      error,
                      created_at,
                      started_at,
                      finished_at,
                      domain,
                      kind,
                      result: (if (.domain == "trading" and .kind == "backtest") then null else .result end),
                      report_path: (if (.domain == "trading" and .kind == "backtest" and .job_id) then ("/trading-api/paper/backtests/" + .job_id) else null end),
                      report_verified: $report_verified
                    }' "$tmp" > "$expected_file"
                    terminal="yes"
                    echo "Collected $request_id status=$status"
                    rm -f "$req"
                    break
                    ;;
                esac
              fi
              sleep 3
            done

            rm -f "$tmp"
            if [ -z "$terminal" ]; then
              echo "Timed out waiting for terminal result: $request_id" >&2
              exit 1
            fi
          done

      - name: Commit collected receipts and clean requests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- job-bridge/results job-bridge/requests && [ -z "$(git status --porcelain -- job-bridge/results job-bridge/requests)" ]; then
            echo "No Job Bridge changes"
            exit 0
          fi
          git config user.name "multi-market-job-bridge"
          git config user.email "job-bridge@users.noreply.github.com"
          git add -A job-bridge/results job-bridge/requests
          git commit -m "Publish Job API receipt and clean processed request"
          git push origin HEAD:main
